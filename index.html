<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GymForge — Gym · Combat · Looks · Mind</title>
    <meta name="description" content="AI-powered training, nutrition, combat technique, looksmaxing and mindset — built for you." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GymForge" />
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      // Register the service worker ourselves so offline support does NOT depend
      // on the OneSignal CDN being reachable. OneSignal reuses this same
      // registration when it loads; when it can't load (offline / blocked), the
      // app still works offline.
      if ('serviceWorker' in navigator) {
        // If a worker was already controlling this page, a controllerchange means
        // a NEW version just took over — reload once so the user actually sees it.
        // Without this, aggressive caching can pin people to an old build forever.
        var hadController = !!navigator.serviceWorker.controller;
        var reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController || reloading) return;
          // HARD CAP: at most one auto-reload per tab session. OneSignal also
          // registers a worker at this scope, so the controller can change more
          // than once; without this cap those changes caused a reload loop.
          try {
            if (sessionStorage.getItem('gymforge_sw_reloaded')) return;
            sessionStorage.setItem('gymforge_sw_reloaded', '1');
          } catch (e) { return; }
          reloading = true;
          window.location.reload();
        });

        window.addEventListener('load', function () {
          var base = location.pathname.replace(/[^/]*$/, '');
          navigator.serviceWorker.register(base + 'sw.js', { scope: base })
            .then(function (reg) {
              // Check for a new build on launch, then at most every 30 min when
              // returning to the foreground. Checking on every visibilitychange
              // hammered the worker and made controller churn worse.
              reg.update().catch(function () {});
              var lastCheck = Date.now();
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState !== 'visible') return;
                if (Date.now() - lastCheck < 1800000) return;
                lastCheck = Date.now();
                reg.update().catch(function () {});
              });
            })
            .catch(function () { /* offline support unavailable; app still runs */ });
        });
      }
    </script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        var base = location.pathname.replace(/[^/]*$/, '');
        await OneSignal.init({
          appId: '7284aa68-3615-4d1c-9983-e02846e4fb7b',
          serviceWorkerPath: base + 'sw.js',
          serviceWorkerParam: { scope: base },
          notifyButton: { enable: true },
          allowLocalhostAsSecureOrigin: true,
        });
      });
      // Called from a real button tap in the app — dashboard-configured auto-prompts
      // are unreliable on iOS PWAs, but a permission request fired directly from a
      // user gesture reliably triggers the native prompt.
      window.gymforgeEnableNotifications = function () {
        return new Promise(function (resolve) {
          window.OneSignalDeferred.push(async function (OneSignal) {
            await OneSignal.Notifications.requestPermission();
            resolve(OneSignal.Notifications.permissionNative || (OneSignal.Notifications.permission ? 'granted' : 'default'));
          });
        });
      };
      window.gymforgeNotificationStatus = function () {
        return new Promise(function (resolve) {
          window.OneSignalDeferred.push(function (OneSignal) {
            resolve(OneSignal.Notifications.permissionNative || (OneSignal.Notifications.permission ? 'granted' : 'default'));
          });
        });
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
      <script>
      // Last-resort recovery: if the React root is still empty a few seconds
      // after load (9s, generous for a slow phone on a cold start), the bundle is broken. Unregister the worker, drop the
      // caches and reload ONCE (flag-guarded, so this can never loop).
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) return;
          try {
            if (sessionStorage.getItem('gymforge_recovered')) return;
            sessionStorage.setItem('gymforge_recovered', '1');
          } catch (e) { return; }
          var done = function () { window.location.reload(); };
          try {
            if ('caches' in window) {
              caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }).catch(function () {}).then(function () {
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function (rs) {
                    return Promise.all(rs.map(function (r) { return r.unregister(); }));
                  }).catch(function () {}).then(done);
                } else { done(); }
              });
            } else { done(); }
          } catch (e) { done(); }
        }, 9000);
      });
    </script>
</body>
</html>
