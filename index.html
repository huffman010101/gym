<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GymForge — Gym · Combat · Looks · Mind</title>
    <meta name="description" content="AI-powered training, nutrition, combat technique, looksmaxing and mindset — built for you." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GymForge" />
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      // Register the service worker ourselves so offline support does NOT depend
      // on the OneSignal CDN being reachable. OneSignal reuses this same
      // registration when it loads; when it can't load (offline / blocked), the
      // app still works offline.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          var base = location.pathname.replace(/[^/]*$/, '');
          navigator.serviceWorker.register(base + 'sw.js', { scope: base })
            .catch(function () { /* offline support unavailable; app still runs */ });
        });
      }
    </script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        var base = location.pathname.replace(/[^/]*$/, '');
        await OneSignal.init({
          appId: '7284aa68-3615-4d1c-9983-e02846e4fb7b',
          serviceWorkerPath: base + 'sw.js',
          serviceWorkerParam: { scope: base },
          notifyButton: { enable: true },
          allowLocalhostAsSecureOrigin: true,
        });
      });
      // Called from a real button tap in the app — dashboard-configured auto-prompts
      // are unreliable on iOS PWAs, but a permission request fired directly from a
      // user gesture reliably triggers the native prompt.
      window.gymforgeEnableNotifications = function () {
        return new Promise(function (resolve) {
          window.OneSignalDeferred.push(async function (OneSignal) {
            await OneSignal.Notifications.requestPermission();
            resolve(OneSignal.Notifications.permissionNative || (OneSignal.Notifications.permission ? 'granted' : 'default'));
          });
        });
      };
      window.gymforgeNotificationStatus = function () {
        return new Promise(function (resolve) {
          window.OneSignalDeferred.push(function (OneSignal) {
            resolve(OneSignal.Notifications.permissionNative || (OneSignal.Notifications.permission ? 'granted' : 'default'));
          });
        });
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
